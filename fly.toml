# Change "app" to a name that's free on Fly.io before the first deploy.
app = "nexus-transform"
primary_region = "bos"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  MAX_GENERATIONS_PER_HOUR = "25"
  MAX_DAILY_GENERATIONS = "400"

[[mounts]]
  source = "nexus_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
